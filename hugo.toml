baseURL = "https://reedlv.com/"
languageCode = "zh-cn"
defaultContentLanguage = "zh-cn"
title = "Reed's Blog"
theme = "PaperMod"
enableEmoji = true
enableRobotsTXT = true

[pagination]
pagerSize = 10

[params]
env = "production"
defaultTheme = "auto"
DateFormat = "2006-01-02"
ShowReadingTime = true
ShowShareButtons = false
ShowPostNavLinks = true
ShowBreadCrumbs = true
ShowCodeCopyButtons = true
ShowToc = true
TocOpen = false

  [params.homeInfoParams]
  Title = "Hi, I'm Reed"
  Content = "思辨中工作，感悟中生活。"

  [[params.socialIcons]]
  name = "github"
  url = "https://github.com/lvhao"
  title = "GitHub"

  [[params.socialIcons]]
  name = "email"
  url = "mailto:lvhao127@gmail.com"
  title = "lvhao127@gmail.com"

[markup]
  [markup.highlight]
  noClasses = false
  lineNos = false

[outputs]
home = ["HTML", "RSS", "JSON"]

[minify]
disableXML = true
